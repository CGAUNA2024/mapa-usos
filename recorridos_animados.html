<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recorridos — Líneas Urbanas Corrientes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  #header {
    background: #0f172a;
    border-bottom: 2px solid #e94560;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    min-height: 52px;
  }
  #logo-ersa img { height: 32px; }
  #header h1 { font-size: 13px; color: #e94560; line-height: 1.3; white-space: nowrap; }
  #header h1 span.sub { display: block; font-size: 11px; color: #94a3b8; font-weight: normal; }

  #route-title {
    font-size: 14px;
    font-weight: bold;
    color: #f1f5f9;
    padding: 0 12px;
    border-left: 2px solid #334155;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 420px;
  }
  #route-title .rt-desc { font-size: 12px; font-weight: normal; color: #94a3b8; }

  #speed-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; white-space: nowrap; }
  #speed-wrap input { width: 80px; accent-color: #e94560; }
  #speed-label { color: #e2e8f0; font-weight: bold; min-width: 30px; }
  #btn-paradas {
    padding: 5px 12px; border-radius: 6px; border: 1px solid #475569;
    background: #1e293b; color: #94a3b8; font-size: 12px; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  #btn-paradas.active { background: #0ea5e9; border-color: #0ea5e9; color: #fff; font-weight: bold; }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }

  /* ── Panel derecho ── */
  #panel {
    width: 210px;
    background: #1e293b;
    border-left: 1px solid #334155;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #panel-title {
    padding: 9px 12px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #64748b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  #sentido-bar {
    padding: 7px 10px;
    display: none;
    gap: 6px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .sent-btn {
    flex: 1; padding: 5px 0;
    border: 1px solid #475569; background: #0f172a; color: #94a3b8;
    border-radius: 5px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .sent-btn.active { background: #e94560; border-color: #e94560; color: #fff; font-weight: bold; }
  #lines-list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .line-btn {
    width: 100%; padding: 8px 12px;
    border-radius: 7px; border: 2px solid transparent;
    background: #0f172a; color: #e2e8f0;
    font-size: 13px; font-weight: bold;
    cursor: pointer; text-align: left; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .line-btn:hover { background: #1e293b; filter: brightness(1.2); }
  .line-btn.active { background: #1e293b; }
  .line-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

  /* ── Info bar inferior ── */
  #info-bar {
    background: #0f172a; border-top: 1px solid #334155;
    padding: 5px 14px; font-size: 11px; color: #64748b;
    flex-shrink: 0; min-height: 24px;
  }
  #info-bar span { color: #94a3b8; }

  /* ── Bus marker ── */
  .bus-wrapper { display: inline-flex; flex-direction: column; align-items: flex-start; }
  .bus-label {
    background: rgba(15,23,42,.88);
    color: #f1f5f9;
    font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px;
    white-space: nowrap; margin-bottom: 2px;
    border: 1px solid rgba(255,255,255,.15);
    max-width: 170px; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .bus-emoji {
    font-size: 24px; line-height: 1;
    transform-origin: center center;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.8));
    pointer-events: none; display: block;
  }

  /* ── Tooltip próxima parada ── */
  .tooltip-parada { background: #facc15 !important; color: #0f172a !important; border: none !important; font-weight: bold; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .tooltip-parada::before { border-top-color: #facc15 !important; }

  /* ── Scrollbar ── */
  #lines-list::-webkit-scrollbar { width: 5px; }
  #lines-list::-webkit-scrollbar-track { background: #0f172a; }
  #lines-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <div id="logo-ersa"><img src="logo_ersa.png" onerror="this.style.display='none'"></div>
  <h1>🗺 Recorridos<span class="sub">Líneas Urbanas CORRIENTES</span></h1>
  <div id="route-title"></div>
  <button id="btn-paradas" title="Mostrar/ocultar paradas">🚏 Paradas</button>
  <div id="speed-wrap">
    <span>Velocidad:</span>
    <input type="range" id="speed" min="0" max="12" step="1" value="2">
    <span id="speed-label">×0.5</span>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="panel">
    <div id="panel-title">Líneas</div>
    <div id="sentido-bar">
      <button class="sent-btn active" data-s="Ida">▶ Ida</button>
      <button class="sent-btn" data-s="Vuelta">◀ Vuelta</button>
    </div>
    <div id="lines-list">
      <div style="color:#475569;font-size:12px;text-align:center;padding:20px">Cargando recorridos...</div>
    </div>
  </div>
</div>

<div id="info-bar">Seleccioná una línea para ver su recorrido animado.</div>

<script>
// ── Colores ────────────────────────────────────────────────────
const COLORS = {
  '102A':'#FF6B6B','102B':'#FF9F43','102C':'#FECA57',
  '103A':'#48DBFB','103B':'#FF9FF3','103C':'#54A0FF',
  '104A':'#9B59B6','104B':'#00D2D3','104C':'#1DD1A1','104D':'#BDC3C7',
  '105A':'#FD9644','105AT':'#A29BFE','105B':'#6C5CE7','105C':'#FDCB6E',
  '106A':'#E17055','106B':'#74B9FF','106C':'#55EFC4',
  '108A':'#0984E3','108C':'#D63031',
  '109A':'#6AB04C','109B':'#F9CA24',
  'RIACHUELO':'#22A6B3',
  '904A':'#8E44AD','904B':'#E67E22','904C':'#16A085',
  'SANTA ANA':'#C0392B',
  'DOCENTE':'#7F8C8D','VALENCIA':'#2ECC71','SANTA CATALINA':'#F39C12',
  'SAN CAYETANO':'#1ABC9C','UNIDAD PENAL':'#95A5A6',
  '250VIV':'#D35400','PONCE-RIO':'#2980B9',
};

// ── Descripciones Ida (Vuelta se genera automáticamente invirtiendo) ──
const DESC_IDA = {
  '102A':          'B° 17 de Agosto - Puerto',
  '102B':          'B° Laguna Seca - Puerto',
  '102C':          'B° Laguna Brava - Centro',
  '103A':          'B° San Antonio - Puerto',
  '103B':          'B° Dr. Montaña - Puerto',
  '103C':          'B° Esperanza - Puerto',
  '104A':          'B° Juan de Vera - Morgue',
  '104B':          'Ponce - Puerto',
  '104C':          'B° Pujol - B° Río Paraná',
  '104D':          'B° 1000 Viv. - Morgue',
  '105A':          'B° Molina Punta - Puerto',
  '105AT':         'Molina - Punta Taitalo',
  '105B':          'Yecohá - Puerto',
  '105C':          'Perichon - Puerto',
  '106A':          'B° Pirayuí - Puerto',
  '106B':          'B° Nuevo - Puerto',
  '106C':          'B° 500 Viv. - Puerto',
  '108A':          'B° F.J. Quintana - Cuenca',
  '108C':          'B° 40 Viv./San Roque - Centro',
  '109A':          'B° Río Paraná - Pque. del Recuerdo',
  '109B':          'Terminal - Yecohá',
  'RIACHUELO':     'Riachuelo - Puerto',
  '904A':          'Campus Ctes. - Terminal Rcia.',
  '904B':          'UNNE - Puerto x Sarmiento',
  '904C':          'UNNE - Puerto x Barranqueras',
  'SANTA ANA':     'Santa Ana - Terminal',
  'DOCENTE':       'Docente - Puerto',
  'VALENCIA':      'Valencia - Puerto',
  'SANTA CATALINA':'Santa Catalina - Puerto',
  'SAN CAYETANO':  'Centro - San Cayetano/Granja',
  'UNIDAD PENAL':  'Centro - Unidad Penal/San Cayetano',
  '250VIV':        'B° 250 Viv. - Puerto',
  'PONCE-RIO':     'Ponce - Riachuelo',
};

function getDesc(linea, sentido) {
  const ida = DESC_IDA[linea];
  if (!ida) return '';
  if (sentido === 'Ida') return ida;
  // Vuelta: invertir "A - B" → "B - A"
  const sep = ida.indexOf(' - ');
  if (sep === -1) return ida;
  return ida.slice(sep + 3) + ' - ' + ida.slice(0, sep);
}

// ── Mapa ──────────────────────────────────────────────────────
const map = L.map('map', { center: [-27.48, -58.84], zoom: 13 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19,
}).addTo(map);

// ── Estado ────────────────────────────────────────────────────
let RUTAS = {};
let PARADAS = {};
let paradaVisible = false;
let paradaLayer = null;
let nextStopMarker = null;
let visitedStops = new Set();
let routeKm = 0;
let activeLine = null, activeSentido = 'Ida';
let animLayer = null, busMarker = null, animTimer = null;
let animIdx = 0, animPts = [];
let lastBearing = 0;

// ── Nombre de calle (Nominatim, throttled) ─────────────────────
let currentStreet = '';
let lastGeocodePos = null;
let lastGeocodeTime = 0;

async function updateStreet(lat, lon) {
  const now = Date.now();
  if (now - lastGeocodeTime < 1800) return;          // máx 1 llamada cada 1.8s
  if (lastGeocodePos) {
    const d = L.latLng(lat, lon).distanceTo(L.latLng(lastGeocodePos));
    if (d < 80) return;                               // no llamar si no se movió 80m
  }
  lastGeocodeTime = now;
  lastGeocodePos = [lat, lon];
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&format=json&accept-language=es`,
      { headers: { 'User-Agent': 'ERSA-MapaCorrientes/1.0' } }
    );
    const data = await r.json();
    const road = data.address?.road || data.address?.pedestrian || data.address?.path || '';
    if (road !== currentStreet) {
      currentStreet = road;
      if (busMarker) busMarker.setIcon(busIcon(lastBearing));
    }
  } catch(e) {}
}

// ── Cargar paradas ────────────────────────────────────────────
fetch('https://raw.githubusercontent.com/CGAUNA2024/mapa-usos/main/paradas.json')
  .then(r => r.json())
  .then(data => {
    PARADAS = data;
    console.log('Paradas cargadas. Claves:', Object.keys(PARADAS).length);
  })
  .catch(e => {
    console.error('ERROR cargando paradas.json:', e);
    document.getElementById('info-bar').textContent = 'ERROR: no se pudo cargar paradas.json';
  });

// ── Cargar recorridos ─────────────────────────────────────────
fetch('https://raw.githubusercontent.com/CGAUNA2024/mapa-usos/main/recorridos.json')
  .then(r => r.json())
  .then(data => {
    data.forEach(e => {
      const l = e.l, s = e.s;
      if (!RUTAS[l]) RUTAS[l] = {};
      const pts = e.c.map(c => [c[1], c[0]]);   // [lon,lat] → [lat,lon]
      if (!RUTAS[l][s]) RUTAS[l][s] = [pts];    // array de segmentos
      else RUTAS[l][s].push(pts);
    });
    // Para Vuelta: si existe, usarla; si no, invertir segmentos de Ida
    Object.keys(RUTAS).forEach(l => {
      if (!RUTAS[l]['Vuelta'] && RUTAS[l]['Ida']) {
        RUTAS[l]['Vuelta'] = [...RUTAS[l]['Ida']].reverse().map(seg => [...seg].reverse());
      }
    });
    buildPanel();
  })
  .catch(() => {
    document.getElementById('lines-list').innerHTML =
      '<div style="color:#e94560;font-size:12px;padding:16px">Error cargando recorridos.<br>Verificá la conexión.</div>';
  });

// ── Panel de líneas ───────────────────────────────────────────
function buildPanel() {
  const list = document.getElementById('lines-list');
  list.innerHTML = '';
  Object.keys(RUTAS).sort().forEach(linea => {
    const color = COLORS[linea] || '#94a3b8';
    const btn = document.createElement('button');
    btn.className = 'line-btn';
    btn.dataset.linea = linea;
    btn.style.borderColor = color + '55';
    btn.innerHTML = `<span class="line-dot" style="background:${color}"></span>${linea}`;
    btn.addEventListener('click', () => selectLine(linea));
    list.appendChild(btn);
  });
}

// ── Seleccionar línea ─────────────────────────────────────────
function selectLine(linea) {
  document.querySelectorAll('.line-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.linea === linea);
    const c = COLORS[b.dataset.linea] || '#94a3b8';
    b.style.borderColor = b.classList.contains('active') ? c : c + '55';
  });
  activeLine = linea;
  const sentidos = Object.keys(RUTAS[linea]);
  const bar = document.getElementById('sentido-bar');
  bar.style.display = 'flex';
  if (!sentidos.includes(activeSentido)) activeSentido = sentidos[0];
  document.querySelectorAll('.sent-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.s === activeSentido);
  });
  startAnimation();
}

// ── Iniciar animación ─────────────────────────────────────────
function startAnimation() {
  if (!activeLine) return;
  const segs = RUTAS[activeLine]?.[activeSentido];
  if (!segs || !segs.length) return;
  stopAnimation();

  // Resetear nombre de calle
  currentStreet = '';
  lastGeocodePos = null;

  const color = COLORS[activeLine] || '#fff';

  // Dibujar cada segmento por separado (evita líneas rectas entre segmentos)
  if (animLayer) map.removeLayer(animLayer);
  animLayer = L.layerGroup(
    segs.map(seg => L.polyline(seg, { color, weight: 5, opacity: 0.88, lineJoin: 'round', lineCap: 'round' }))
  ).addTo(map);
  const allPts = segs.flat();
  map.fitBounds(L.polyline(allPts).getBounds(), { padding: [30, 30] });

  animPts = interpolate(allPts, 20);
  animIdx = 0;
  visitedStops = new Set();
  routeKm = (routeLength(animPts) / 1000).toFixed(1);
  if (nextStopMarker) { map.removeLayer(nextStopMarker); nextStopMarker = null; }

  if (busMarker) map.removeLayer(busMarker);
  busMarker = L.marker(animPts[0], { icon: busIcon(0), zIndexOffset: 1000 }).addTo(map);

  // Título en header
  const desc = getDesc(activeLine, activeSentido);
  document.getElementById('route-title').innerHTML =
    `<strong style="color:${color}">${activeLine} ${activeSentido}</strong>` +
    (desc ? ` <span class="rt-desc">&nbsp;| ${desc}</span>` : '');

  // Info bar
  const km = (routeLength(animPts) / 1000).toFixed(1);
  document.getElementById('info-bar').innerHTML =
    `<span>${activeLine} ${activeSentido}</span> &nbsp;|&nbsp; ${km} km de recorrido`;

  dibujarParadas();
  runStep();
}

function runStep() {
  if (animIdx >= animPts.length - 1) {
    setTimeout(() => { animIdx = 0; runStep(); }, 1500);
    return;
  }
  const SPEEDS = [0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0];
  const speed = SPEEDS[parseInt(document.getElementById('speed').value)] || 0.5;
  const a = animPts[animIdx], b = animPts[animIdx + 1];
  const dist = L.latLng(a).distanceTo(L.latLng(b));
  const delay = Math.max(30, 500 / speed);   // ×0.1→5000ms … ×1→500ms … ×1.5→333ms

  const brg = bearing(a, b);
  busMarker.setLatLng(b);
  busMarker.setIcon(busIcon(brg));

  updateStreet(b[0], b[1]);  // async, no bloquea
  updateNextStop(b[0], b[1]);

  animIdx++;
  animTimer = setTimeout(runStep, delay);
}

function stopAnimation() {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
}

// ── Bus icon con etiqueta de calle ────────────────────────────
function busIcon(deg) {
  lastBearing = deg;
  // 🚌 mira a la DERECHA por defecto. Ruedas abajo.
  // Limitamos a ±72° para que las ruedas nunca queden arriba,
  // y usamos scaleX(-1) cuando viaja hacia la izquierda.
  const norm = ((deg % 360) + 360) % 360;
  const MAX = 72;
  let transform;
  if (norm <= 180) {
    // Mitad este: rotación directa, clampeada
    const r = Math.max(-MAX, Math.min(MAX, norm - 90));
    transform = `rotate(${r}deg)`;
  } else {
    // Mitad oeste: espejo + rotación clampeada
    const r = Math.max(-MAX, Math.min(MAX, 270 - norm));
    transform = `scaleX(-1) rotate(${r}deg)`;
  }
  const label = currentStreet
    ? `<div class="bus-label">📍 ${currentStreet}</div>`
    : '';
  return L.divIcon({
    className: '',
    html: `<div class="bus-wrapper">${label}<span class="bus-emoji" style="transform:${transform}">🚌</span></div>`,
    iconSize: [28, currentStreet ? 50 : 28],
    iconAnchor: [14, currentStreet ? 46 : 24],
  });
}

// ── Interpolación ─────────────────────────────────────────────
function interpolate(pts, stepM) {
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = L.latLng(pts[i]), b = L.latLng(pts[i+1]);
    const d = a.distanceTo(b);
    const steps = Math.max(1, Math.ceil(d / stepM));
    for (let j = 1; j <= steps; j++) {
      const t = j / steps;
      out.push([pts[i][0] + (pts[i+1][0]-pts[i][0])*t, pts[i][1] + (pts[i+1][1]-pts[i][1])*t]);
    }
  }
  return out;
}

// ── Bearing ───────────────────────────────────────────────────
function bearing(a, b) {
  const lat1 = a[0]*Math.PI/180, lat2 = b[0]*Math.PI/180;
  const dLon = (b[1]-a[1])*Math.PI/180;
  const y = Math.sin(dLon)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return Math.atan2(y, x)*180/Math.PI;
}

// ── Longitud ──────────────────────────────────────────────────
function routeLength(pts) {
  let d = 0;
  for (let i = 0; i < pts.length-1; i++) d += L.latLng(pts[i]).distanceTo(L.latLng(pts[i+1]));
  return d;
}

// ── Próxima parada ────────────────────────────────────────────
function updateNextStop(lat, lon) {
  try {
    const key = `${activeLine}_${activeSentido}`;
    const stops = PARADAS[key];
    if (!stops || !stops.length) {
      if (Object.keys(PARADAS).length > 0) {
        console.warn('Sin paradas para clave:', key, '— claves disponibles:', Object.keys(PARADAS).slice(0,5));
      }
      return;
    }

    // Marcar como visitada si el bus pasó a menos de 55m
    stops.forEach((p, i) => {
      if (!visitedStops.has(i)) {
        const d = L.latLng(lat, lon).distanceTo(L.latLng(p.lat, p.lon));
        if (d < 55) visitedStops.add(i);
      }
    });

    // Encontrar la más cercana no visitada
    let minDist = Infinity, nearest = null;
    stops.forEach((p, i) => {
      if (visitedStops.has(i)) return;
      const d = L.latLng(lat, lon).distanceTo(L.latLng(p.lat, p.lon));
      if (d < minDist) { minDist = d; nearest = p; }
    });

    if (!nearest) {
      if (nextStopMarker) { map.removeLayer(nextStopMarker); nextStopMarker = null; }
      document.getElementById('info-bar').innerHTML =
        `<span>${activeLine} ${activeSentido}</span> &nbsp;|&nbsp; ${routeKm} km &nbsp;·&nbsp; 🏁 Fin de recorrido`;
      return;
    }

    // Info bar
    document.getElementById('info-bar').innerHTML =
      `<span>${activeLine} ${activeSentido}</span> &nbsp;|&nbsp; ${routeKm} km &nbsp;·&nbsp; ` +
      `🚏 Próxima: <b>${nearest.d}</b> <span style="color:#64748b">(${Math.round(minDist)} m)</span>`;

    // Marcador amarillo pulsante
    if (!nextStopMarker) {
      nextStopMarker = L.circleMarker([nearest.lat, nearest.lon], {
        radius: 9, color: '#fff', weight: 2.5,
        fillColor: '#facc15', fillOpacity: 1,
      }).addTo(map);
    } else {
      nextStopMarker.setLatLng([nearest.lat, nearest.lon]);
    }
    nextStopMarker.unbindTooltip();
    nextStopMarker.bindTooltip(`<b>🚏 ${nearest.d}</b>`, {
      direction: 'top', offset: [0, -12], permanent: false,
      className: 'tooltip-parada',
    });
  } catch(e) {
    console.error('updateNextStop error:', e);
  }
}

// ── Paradas ───────────────────────────────────────────────────
function dibujarParadas() {
  if (paradaLayer) { map.removeLayer(paradaLayer); paradaLayer = null; }
  if (!paradaVisible || !activeLine) return;
  const key = `${activeLine}_${activeSentido}`;
  const pts = PARADAS[key];
  if (!pts || !pts.length) return;
  const color = COLORS[activeLine] || '#0ea5e9';
  paradaLayer = L.layerGroup();
  pts.forEach(p => {
    L.circleMarker([p.lat, p.lon], {
      radius: 5, color: '#fff', weight: 1.5,
      fillColor: color, fillOpacity: 0.9,
    })
    .bindTooltip(p.d, { direction: 'top', offset: [0, -6] })
    .addTo(paradaLayer);
  });
  paradaLayer.addTo(map);
}

document.getElementById('btn-paradas').addEventListener('click', function() {
  paradaVisible = !paradaVisible;
  this.classList.toggle('active', paradaVisible);
  dibujarParadas();
});

// ── Eventos ───────────────────────────────────────────────────
document.querySelectorAll('.sent-btn').forEach(b => {
  b.addEventListener('click', () => {
    activeSentido = b.dataset.s;
    document.querySelectorAll('.sent-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    startAnimation();
  });
});

document.getElementById('speed').addEventListener('input', function() {
  const SPEEDS = [0.1, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0];
  const v = SPEEDS[parseInt(this.value)];
  document.getElementById('speed-label').textContent = '×' + v;
});
</script>
