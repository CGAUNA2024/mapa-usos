<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recorridos — Líneas Urbanas Corrientes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  #header {
    background: #0f172a;
    border-bottom: 2px solid #e94560;
    padding: 7px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    min-height: 52px;
  }
  #logo-ersa img { height: 32px; }
  #header h1 { font-size: 13px; color: #e94560; line-height: 1.3; white-space: nowrap; }
  #header h1 span.sub { display: block; font-size: 11px; color: #94a3b8; font-weight: normal; }

  #route-title {
    font-size: 14px;
    font-weight: bold;
    color: #f1f5f9;
    padding: 0 12px;
    border-left: 2px solid #334155;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 420px;
  }
  #route-title .rt-desc { font-size: 12px; font-weight: normal; color: #94a3b8; }

  #speed-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: #94a3b8; white-space: nowrap; }
  #speed-wrap input { width: 80px; accent-color: #e94560; }
  #speed-label { color: #e2e8f0; font-weight: bold; min-width: 30px; }

  /* ── Main layout ── */
  #main { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }

  /* ── Panel derecho ── */
  #panel {
    width: 210px;
    background: #1e293b;
    border-left: 1px solid #334155;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }
  #panel-title {
    padding: 9px 12px 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #64748b;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  #sentido-bar {
    padding: 7px 10px;
    display: none;
    gap: 6px;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  .sent-btn {
    flex: 1; padding: 5px 0;
    border: 1px solid #475569; background: #0f172a; color: #94a3b8;
    border-radius: 5px; font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .sent-btn.active { background: #e94560; border-color: #e94560; color: #fff; font-weight: bold; }
  #lines-list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .line-btn {
    width: 100%; padding: 8px 12px;
    border-radius: 7px; border: 2px solid transparent;
    background: #0f172a; color: #e2e8f0;
    font-size: 13px; font-weight: bold;
    cursor: pointer; text-align: left; transition: all .15s;
    display: flex; align-items: center; gap: 8px;
  }
  .line-btn:hover { background: #1e293b; filter: brightness(1.2); }
  .line-btn.active { background: #1e293b; }
  .line-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

  /* ── Info bar inferior ── */
  #info-bar {
    background: #0f172a; border-top: 1px solid #334155;
    padding: 5px 14px; font-size: 11px; color: #64748b;
    flex-shrink: 0; min-height: 24px;
  }
  #info-bar span { color: #94a3b8; }

  /* ── Bus marker ── */
  .bus-wrapper { display: inline-flex; flex-direction: column; align-items: flex-start; }
  .bus-label {
    background: rgba(15,23,42,.88);
    color: #f1f5f9;
    font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px;
    white-space: nowrap; margin-bottom: 2px;
    border: 1px solid rgba(255,255,255,.15);
    max-width: 170px; overflow: hidden; text-overflow: ellipsis;
    pointer-events: none;
    box-shadow: 0 1px 4px rgba(0,0,0,.6);
  }
  .bus-emoji {
    font-size: 24px; line-height: 1;
    transform-origin: center center;
    filter: drop-shadow(0 1px 4px rgba(0,0,0,.8));
    pointer-events: none; display: block;
  }

  /* ── Scrollbar ── */
  #lines-list::-webkit-scrollbar { width: 5px; }
  #lines-list::-webkit-scrollbar-track { background: #0f172a; }
  #lines-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
</style>
</head>
<body>

<div id="header">
  <div id="logo-ersa"><img src="logo_ersa.png" onerror="this.style.display='none'"></div>
  <h1>🗺 Recorridos<span class="sub">Líneas Urbanas CORRIENTES</span></h1>
  <div id="route-title"></div>
  <div id="speed-wrap">
    <span>Velocidad:</span>
    <input type="range" id="speed" min="0.25" max="1" step="0.25" value="0.5">
    <span id="speed-label">×0.5</span>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="panel">
    <div id="panel-title">Líneas</div>
    <div id="sentido-bar">
      <button class="sent-btn active" data-s="Ida">▶ Ida</button>
      <button class="sent-btn" data-s="Vuelta">◀ Vuelta</button>
    </div>
    <div id="lines-list">
      <div style="color:#475569;font-size:12px;text-align:center;padding:20px">Cargando recorridos...</div>
    </div>
  </div>
</div>

<div id="info-bar">Seleccioná una línea para ver su recorrido animado.</div>

<script>
// ── Colores ────────────────────────────────────────────────────
const COLORS = {
  '102A':'#FF6B6B','102B':'#FF9F43','102C':'#FECA57',
  '103A':'#48DBFB','103B':'#FF9FF3','103C':'#54A0FF',
  '104A':'#9B59B6','104B':'#00D2D3','104C':'#1DD1A1','104D':'#BDC3C7',
  '105A':'#FD9644','105AT':'#A29BFE','105B':'#6C5CE7','105C':'#FDCB6E',
  '106A':'#E17055','106B':'#74B9FF','106C':'#55EFC4',
  '108A':'#0984E3','108C':'#D63031',
  '109A':'#6AB04C','109B':'#F9CA24',
  'RIACHUELO':'#22A6B3',
};

// ── Descripciones Ida (Vuelta se genera automáticamente invirtiendo) ──
const DESC_IDA = {
  '102A':     'B° 17 de Agosto - Puerto',
  '102B':     'B° Laguna Seca - Puerto',
  '102C':     'B° Laguna Brava - Puerto',
  '103A':     'B° San Antonio - Puerto',
  '103B':     'B° Dr. Montaña - Puerto',
  '103C':     'Calesita (B° Esperanza/Montaña) - B° Esperanza/Puerto',
  '104A':     'B° Juan de Vera - Morgue',
  '104B':     'B° Patono - Centro',
  '104C':     'B° Pujol - B° Río Paraná',
  '104D':     'B° 1000 Viv. - Morgue',
  '105A':     'B° Molina Punta - Puerto',
  '105AT':    'Calesita - (Punta Taitalo - M. Punta)',
  '105B':     'B° Apipé - Puerto',
  '105C':     'Perichon - Puerto',
  '106A':     'B° Pirayuí - Puerto',
  '106B':     'B° Nuevo - Puerto',
  '106C':     'B° 500V (Pirayuí Nuevo) - Puerto',
  '108A':     'B° Quintana - Cuenca',
  '108C':     'B° 40 Viv. B° San Roque - Centro',
  '109A':     'B° Río Paraná - Pque. del Recuerdo',
  '109B':     'B° Río Paraná/Terminal - B° Yecohá',
  'RIACHUELO':'Riachuelo - Puerto',
};

function getDesc(linea, sentido) {
  const ida = DESC_IDA[linea];
  if (!ida) return '';
  if (sentido === 'Ida') return ida;
  // Vuelta: invertir "A - B" → "B - A"
  const sep = ida.indexOf(' - ');
  if (sep === -1) return ida;
  return ida.slice(sep + 3) + ' - ' + ida.slice(0, sep);
}

// ── Mapa ──────────────────────────────────────────────────────
const map = L.map('map', { center: [-27.48, -58.84], zoom: 13 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap', maxZoom: 19,
}).addTo(map);

// ── Estado ────────────────────────────────────────────────────
let RUTAS = {};
let activeLine = null, activeSentido = 'Ida';
let animLayer = null, busMarker = null, animTimer = null;
let animIdx = 0, animPts = [];
let lastBearing = 0;

// ── Nombre de calle (Nominatim, throttled) ─────────────────────
let currentStreet = '';
let lastGeocodePos = null;
let lastGeocodeTime = 0;

async function updateStreet(lat, lon) {
  const now = Date.now();
  if (now - lastGeocodeTime < 1800) return;          // máx 1 llamada cada 1.8s
  if (lastGeocodePos) {
    const d = L.latLng(lat, lon).distanceTo(L.latLng(lastGeocodePos));
    if (d < 80) return;                               // no llamar si no se movió 80m
  }
  lastGeocodeTime = now;
  lastGeocodePos = [lat, lon];
  try {
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat.toFixed(5)}&lon=${lon.toFixed(5)}&format=json&accept-language=es`,
      { headers: { 'User-Agent': 'ERSA-MapaCorrientes/1.0' } }
    );
    const data = await r.json();
    const road = data.address?.road || data.address?.pedestrian || data.address?.path || '';
    if (road !== currentStreet) {
      currentStreet = road;
      if (busMarker) busMarker.setIcon(busIcon(lastBearing));
    }
  } catch(e) {}
}

// ── Cargar recorridos ─────────────────────────────────────────
fetch('https://raw.githubusercontent.com/CGAUNA2024/mapa-usos/main/recorridos.json')
  .then(r => r.json())
  .then(data => {
    data.forEach(e => {
      const l = e.l, s = e.s;
      if (!RUTAS[l]) RUTAS[l] = {};
      const pts = e.c.map(c => [c[1], c[0]]);   // [lon,lat] → [lat,lon]
      if (!RUTAS[l][s]) RUTAS[l][s] = pts;
      else RUTAS[l][s] = RUTAS[l][s].concat(pts);
    });
    // Para Vuelta: si existe, usarla; si no, invertir la Ida
    Object.keys(RUTAS).forEach(l => {
      if (!RUTAS[l]['Vuelta'] && RUTAS[l]['Ida']) {
        RUTAS[l]['Vuelta'] = [...RUTAS[l]['Ida']].reverse();
      }
    });
    buildPanel();
  })
  .catch(() => {
    document.getElementById('lines-list').innerHTML =
      '<div style="color:#e94560;font-size:12px;padding:16px">Error cargando recorridos.<br>Verificá la conexión.</div>';
  });

// ── Panel de líneas ───────────────────────────────────────────
function buildPanel() {
  const list = document.getElementById('lines-list');
  list.innerHTML = '';
  Object.keys(RUTAS).sort().forEach(linea => {
    const color = COLORS[linea] || '#94a3b8';
    const btn = document.createElement('button');
    btn.className = 'line-btn';
    btn.dataset.linea = linea;
    btn.style.borderColor = color + '55';
    btn.innerHTML = `<span class="line-dot" style="background:${color}"></span>${linea}`;
    btn.addEventListener('click', () => selectLine(linea));
    list.appendChild(btn);
  });
}

// ── Seleccionar línea ─────────────────────────────────────────
function selectLine(linea) {
  document.querySelectorAll('.line-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.linea === linea);
    const c = COLORS[b.dataset.linea] || '#94a3b8';
    b.style.borderColor = b.classList.contains('active') ? c : c + '55';
  });
  activeLine = linea;
  const sentidos = Object.keys(RUTAS[linea]);
  const bar = document.getElementById('sentido-bar');
  bar.style.display = 'flex';
  if (!sentidos.includes(activeSentido)) activeSentido = sentidos[0];
  document.querySelectorAll('.sent-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.s === activeSentido);
  });
  startAnimation();
}

// ── Iniciar animación ─────────────────────────────────────────
function startAnimation() {
  if (!activeLine) return;
  const pts = RUTAS[activeLine]?.[activeSentido];
  if (!pts || pts.length < 2) return;
  stopAnimation();

  // Resetear nombre de calle
  currentStreet = '';
  lastGeocodePos = null;

  const color = COLORS[activeLine] || '#fff';

  // Recorrido
  if (animLayer) map.removeLayer(animLayer);
  animLayer = L.polyline(pts, { color, weight: 5, opacity: 0.88, lineJoin: 'round', lineCap: 'round' }).addTo(map);
  map.fitBounds(animLayer.getBounds(), { padding: [30, 30] });

  animPts = interpolate(pts, 20);
  animIdx = 0;

  if (busMarker) map.removeLayer(busMarker);
  busMarker = L.marker(animPts[0], { icon: busIcon(0), zIndexOffset: 1000 }).addTo(map);

  // Título en header
  const desc = getDesc(activeLine, activeSentido);
  document.getElementById('route-title').innerHTML =
    `<strong style="color:${color}">${activeLine} ${activeSentido}</strong>` +
    (desc ? ` <span class="rt-desc">&nbsp;| ${desc}</span>` : '');

  // Info bar
  const km = (routeLength(animPts) / 1000).toFixed(1);
  document.getElementById('info-bar').innerHTML =
    `<span>${activeLine} ${activeSentido}</span> &nbsp;|&nbsp; ${km} km de recorrido`;

  runStep();
}

function runStep() {
  if (animIdx >= animPts.length - 1) {
    setTimeout(() => { animIdx = 0; runStep(); }, 1500);
    return;
  }
  const speed = parseFloat(document.getElementById('speed').value);
  const a = animPts[animIdx], b = animPts[animIdx + 1];
  const dist = L.latLng(a).distanceTo(L.latLng(b));
  const delay = Math.max(30, 500 / speed);   // ×0.25→2000ms  ×0.5→1000ms  ×0.75→667ms  ×1→500ms

  const brg = bearing(a, b);
  busMarker.setLatLng(b);
  busMarker.setIcon(busIcon(brg));

  updateStreet(b[0], b[1]);  // async, no bloquea

  animIdx++;
  animTimer = setTimeout(runStep, delay);
}

function stopAnimation() {
  if (animTimer) { clearTimeout(animTimer); animTimer = null; }
}

// ── Bus icon con etiqueta de calle ────────────────────────────
function busIcon(deg) {
  lastBearing = deg;
  const label = currentStreet
    ? `<div class="bus-label">📍 ${currentStreet}</div>`
    : '';
  return L.divIcon({
    className: '',
    html: `<div class="bus-wrapper">${label}<span class="bus-emoji" style="transform:rotate(${deg - 90}deg)">🚌</span></div>`,
    iconSize: [28, currentStreet ? 50 : 28],
    iconAnchor: [14, currentStreet ? 46 : 24],
  });
}

// ── Interpolación ─────────────────────────────────────────────
function interpolate(pts, stepM) {
  const out = [pts[0]];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = L.latLng(pts[i]), b = L.latLng(pts[i+1]);
    const d = a.distanceTo(b);
    const steps = Math.max(1, Math.ceil(d / stepM));
    for (let j = 1; j <= steps; j++) {
      const t = j / steps;
      out.push([pts[i][0] + (pts[i+1][0]-pts[i][0])*t, pts[i][1] + (pts[i+1][1]-pts[i][1])*t]);
    }
  }
  return out;
}

// ── Bearing ───────────────────────────────────────────────────
function bearing(a, b) {
  const lat1 = a[0]*Math.PI/180, lat2 = b[0]*Math.PI/180;
  const dLon = (b[1]-a[1])*Math.PI/180;
  const y = Math.sin(dLon)*Math.cos(lat2);
  const x = Math.cos(lat1)*Math.sin(lat2) - Math.sin(lat1)*Math.cos(lat2)*Math.cos(dLon);
  return Math.atan2(y, x)*180/Math.PI;
}

// ── Longitud ──────────────────────────────────────────────────
function routeLength(pts) {
  let d = 0;
  for (let i = 0; i < pts.length-1; i++) d += L.latLng(pts[i]).distanceTo(L.latLng(pts[i+1]));
  return d;
}

// ── Eventos ───────────────────────────────────────────────────
document.querySelectorAll('.sent-btn').forEach(b => {
  b.addEventListener('click', () => {
    activeSentido = b.dataset.s;
    document.querySelectorAll('.sent-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    startAnimation();
  });
});

document.getElementById('speed').addEventListener('input', function() {
  document.getElementById('speed-label').textContent = '×' + parseFloat(this.value).toFixed(2).replace('.00','');
});
</script>
</body>
</html>
