<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usos por Zona - Líneas Urbanas Corrientes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 100%; height: 100%; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; width: 100%; height: 100vh; display: flex; flex-direction: column; overflow: hidden; position: fixed; top:0; left:0; right:0; bottom:0; }
#map { flex: 1; width: 100%; min-height: 0; }

#header {
  background: linear-gradient(135deg, #16213e, #0f3460);
  padding: 8px 14px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  flex-wrap: wrap;
  border-bottom: 2px solid #e94560;
  flex-shrink: 0;
}
#header h1 { font-size: 14px; color: #e94560; white-space: nowrap; margin-bottom: 2px; }

.fg { display: flex; flex-direction: column; gap: 2px; }
.fg label { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
.fg select, .fg input {
  background: #0f3460; color: #fff;
  border: 1px solid #e94560; border-radius: 4px;
  padding: 4px 7px; font-size: 12px; min-width: 105px;
}
.fg select.narrow, .fg input.narrow { min-width: 72px; }
#btnFiltrar {
  background: #e94560; color: white; border: none;
  border-radius: 6px; padding: 6px 14px;
  font-size: 12px; font-weight: bold; cursor: pointer;
  margin-bottom: 1px;
}
#btnFiltrar:hover { background: #c73652; }

#info-bar {
  background: #16213e; padding: 4px 14px;
  font-size: 11px; color: #aaa;
  display: flex; gap: 16px; align-items: center;
  flex-shrink: 0; border-bottom: 1px solid #333;
}
#info-bar b { color: #fff; }
#map { flex: 1; }

/* ── Leyenda burbujas ── */
#legend {
  position: absolute; bottom: 28px; right: 10px;
  background: rgba(22,33,62,0.93);
  border: 1px solid #444; border-radius: 8px;
  padding: 8px 12px; z-index: 1000; font-size: 11px;
  max-width: 170px;
}
#legend h4 { color: #e94560; margin-bottom: 5px; font-size: 11px; }
.li { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
.ld { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0; }

/* ── Panel gráfico por día ── */
#panel-dias {
  position: absolute; bottom: 175px; left: 10px;
  background: rgba(22,33,62,0.95);
  border: 1px solid #444; border-radius: 8px;
  padding: 10px 12px; z-index: 1000;
  width: 320px;
}
#panel-dias h4 { color: #e94560; font-size: 11px; margin-bottom: 6px; }
#chart-dias { display: block; width: 100%; }

/* ── Panel gráfico por hora ── */
#panel-horas {
  position: absolute; bottom: 28px; left: 10px;
  background: rgba(22,33,62,0.95);
  border: 1px solid #444; border-radius: 8px;
  padding: 10px 12px; z-index: 1000;
  width: 320px;
}
#panel-horas h4 { color: #e94560; font-size: 11px; margin-bottom: 6px; }
#chart-horas { display: block; width: 100%; }
#tooltip-hora {
  position: absolute; background: rgba(15,52,96,0.97);
  border: 1px solid #e94560; border-radius: 5px;
  padding: 5px 9px; font-size: 11px; color: #fff;
  pointer-events: none; display: none; z-index: 2000;
  white-space: nowrap;
}

/* ── Loading ── */
#loading {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(22,33,62,0.97);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 9999; gap: 14px;
}
#loading p { font-size: 15px; }
#progress { width: 260px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
#progress-bar { height: 100%; width: 0%; background: #e94560; transition: width 0.3s; border-radius: 3px; }
#prog-text { font-size: 12px; color: #aaa; }
</style>
</head>
<body>

<div id="loading">
  <p>⏳ Cargando datos del mapa...</p>
  <div id="progress"><div id="progress-bar"></div></div>
  <div id="prog-text">Iniciando...</div>
</div>

<div id="header">
  <div><h1>🗺 Usos por Zona — Líneas Urbanas Corrientes</h1></div>
  <div class="fg">
    <label>Línea</label>
    <select id="selLinea"><option value="">— Todas —</option></select>
  </div>
  <div class="fg">
    <label>Fecha desde</label>
    <input type="date" id="fechaDesde"/>
  </div>
  <div class="fg">
    <label>Fecha hasta</label>
    <input type="date" id="fechaHasta"/>
  </div>
  <div class="fg">
    <label>Hora desde</label>
    <select id="horaDesde" class="narrow">
      <option value="">— —</option>
    </select>
  </div>
  <div class="fg">
    <label>Hora hasta</label>
    <select id="horaHasta" class="narrow">
      <option value="">— —</option>
    </select>
  </div>
  <div class="fg">
    <label>Sentido</label>
    <select id="selSentido">
      <option value="">— Ambos —</option>
      <option value="Ida">Ida</option>
      <option value="Vuelta">Vuelta</option>
    </select>
  </div>
  <button id="btnFiltrar">▶ Aplicar</button>
</div>

<div id="info-bar">
  <div>Zonas: <b id="lblZonas">0</b></div>
  <div>Total usos: <b id="lblUsos">0</b></div>
  <div>Línea: <b id="lblLinea">todas</b></div>
  <div>Sentido: <b id="lblSentido">ambos</b></div>
  <div>Hora: <b id="lblHora">todas</b></div>
</div>

<div id="map"></div>

<!-- Gráfico usos por día (últimos 8 días) -->
<div id="panel-dias">
  <h4>📅 Usos por día — últimos 8 días</h4>
  <svg id="chart-dias" width="296" height="100" style="display:block;overflow:visible;"></svg>
</div>

<!-- Gráfico usos por hora -->
<div id="panel-horas">
  <h4>⏱ Usos por hora</h4>
  <svg id="chart-horas" width="296" height="100" style="display:block;overflow:visible;"></svg>
</div>
<div id="tooltip-hora"></div>

<!-- Leyenda burbujas -->
<div id="legend">
  <h4>Usos por burbuja</h4>
  <div class="li"><div class="ld" style="background:rgba(30,144,255,0.85)"></div> 1 – 99</div>
  <div class="li"><div class="ld" style="background:rgba(255,165,0,0.85)"></div> 100 – 499</div>
  <div class="li"><div class="ld" style="background:rgba(220,50,50,0.88)"></div> 500+</div>
  <div style="margin-top:5px;color:#aaa;font-size:10px">Zoom para ver zonas individuales</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<script>
var RAW_DATA = [];
var map, clusterGroup;

// ── mapa base ──────────────────────────────────────────────
function initMap() {
  map = L.map('map', { center: [-27.480, -58.813], zoom: 12 });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  }).addTo(map);
}

// ── colores y tamaños ──────────────────────────────────────
function getColor(u) {
  return u >= 500 ? 'rgba(220,50,50,0.88)' : u >= 100 ? 'rgba(255,165,0,0.85)' : 'rgba(30,144,255,0.85)';
}
function getSize(u) {
  if (u >= 1000) return 52; if (u >= 500) return 44; if (u >= 200) return 36;
  if (u >= 100)  return 30; if (u >= 50)  return 24; if (u >= 20)  return 20;
  return 16;
}
function fmt(n) { return n >= 1000 ? (n/1000).toFixed(1)+'k' : ''+n; }

function mkIcon(usos) {
  var c = getColor(usos), s = getSize(usos), l = fmt(usos);
  var fs = s < 22 ? 9 : s < 30 ? 10 : 11;
  return L.divIcon({
    className: '',
    html: '<div style="width:'+s+'px;height:'+s+'px;background:'+c+';border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;border:2px solid rgba(255,255,255,0.7);box-shadow:0 0 6px rgba(0,0,0,0.5);font-size:'+fs+'px;text-shadow:0 1px 2px rgba(0,0,0,0.9);">'+l+'</div>',
    iconSize: [s,s], iconAnchor: [s/2,s/2]
  });
}

// ── gráfico SVG por hora ───────────────────────────────────
function renderChartHoras(usosPorHora) {
  var svg = document.getElementById('chart-horas');
  var tooltip = document.getElementById('tooltip-hora');
  svg.innerHTML = '';

  var W = 296, H = 80, LBL = 14;  // ancho total, alto barras, alto etiquetas
  var n = 24;
  var gap = 2;
  var barW = Math.floor((W - gap * (n - 1)) / n);

  var vals = [];
  for (var x = 0; x < n; x++) vals.push(usosPorHora[x] || 0);

  // Escala raíz cuadrada para resaltar diferencias
  var sqrtVals = vals.map(function(v){ return Math.sqrt(v); });
  var maxSqrt = Math.max.apply(null, sqrtVals.concat([1]));

  for (var h = 0; h < n; h++) {
    var val = vals[h];
    var ratio = sqrtVals[h] / maxSqrt;
    var barH = val > 0 ? Math.max(Math.round(ratio * H), 3) : 0;
    var x = h * (barW + gap);
    var y = H - barH;

    // Color degradado verde → amarillo → rojo según ratio (0=rojo, 1=verde)
    var r = Math.round(ratio < 0.5 ? 220 : 220 - (ratio - 0.5) * 2 * (220 - 40));
    var g = Math.round(ratio < 0.5 ? ratio * 2 * 180 : 180);
    var color = 'rgba(' + r + ',' + g + ',30,0.92)';

    // Barra
    if (barH > 0) {
      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', y);
      rect.setAttribute('width', barW);
      rect.setAttribute('height', barH);
      rect.setAttribute('fill', color);
      rect.setAttribute('rx', '2');
      rect.style.cursor = 'pointer';

      (function(hora, usos, rx) {
        rect.addEventListener('mousemove', function(e) {
          tooltip.style.display = 'block';
          tooltip.style.left = (e.pageX + 12) + 'px';
          tooltip.style.top  = (e.pageY - 36) + 'px';
          tooltip.textContent = hora + ':00 hs — ' + usos.toLocaleString() + ' usos';
        });
        rect.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });
      })(h, val, x);

      svg.appendChild(rect);
    }

    // Etiqueta cada 3 horas
    if (h % 3 === 0) {
      var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', x + barW / 2);
      txt.setAttribute('y', H + LBL);
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('font-size', '8');
      txt.setAttribute('fill', '#888');
      txt.setAttribute('font-family', 'Segoe UI, sans-serif');
      txt.textContent = h;
      svg.appendChild(txt);
    }
  }

  // Línea base
  var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', 0); line.setAttribute('y1', H);
  line.setAttribute('x2', W); line.setAttribute('y2', H);
  line.setAttribute('stroke', '#444'); line.setAttribute('stroke-width', '1');
  svg.appendChild(line);

  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (H + LBL + 2));
  svg.setAttribute('height', H + LBL + 2);
}

// ── gráfico SVG por día (últimos 8 días) ──────────────────
function renderChartDias(usosPorDia) {
  var svg = document.getElementById('chart-dias');
  var tooltip = document.getElementById('tooltip-hora'); // reutiliza el mismo tooltip
  svg.innerHTML = '';

  var W = 296, H = 80, LBL = 18;
  var gap = 4;

  // Obtener los últimos 8 días con datos, ordenados
  var fechas = Object.keys(usosPorDia).sort().slice(-8);
  var n = fechas.length;
  if (n === 0) { svg.setAttribute('height', 0); return; }

  var barW = Math.floor((W - gap * (n - 1)) / n);
  var vals = fechas.map(function(f){ return usosPorDia[f]; });

  var sqrtVals = vals.map(function(v){ return Math.sqrt(v); });
  var maxSqrt = Math.max.apply(null, sqrtVals.concat([1]));

  for (var i = 0; i < n; i++) {
    var val = vals[i];
    var ratio = sqrtVals[i] / maxSqrt;
    var barH = val > 0 ? Math.max(Math.round(ratio * H), 4) : 0;
    var x = i * (barW + gap);
    var y = H - barH;

    // Degradado verde → rojo igual que horas
    var r = Math.round(ratio < 0.5 ? 220 : 220 - (ratio - 0.5) * 2 * (220 - 40));
    var g = Math.round(ratio < 0.5 ? ratio * 2 * 180 : 180);
    var color = 'rgba(' + r + ',' + g + ',30,0.92)';

    if (barH > 0) {
      var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', x);
      rect.setAttribute('y', y);
      rect.setAttribute('width', barW);
      rect.setAttribute('height', barH);
      rect.setAttribute('fill', color);
      rect.setAttribute('rx', '2');
      rect.style.cursor = 'pointer';

      (function(fecha, usos) {
        rect.addEventListener('mousemove', function(e) {
          tooltip.style.display = 'block';
          tooltip.style.left = (e.pageX + 12) + 'px';
          tooltip.style.top  = (e.pageY - 36) + 'px';
          // Formatear fecha dd/mm
          var partes = fecha.split('-');
          tooltip.textContent = partes[2] + '/' + partes[1] + ' — ' + usos.toLocaleString() + ' usos';
        });
        rect.addEventListener('mouseleave', function() { tooltip.style.display = 'none'; });
      })(fechas[i], val);

      svg.appendChild(rect);
    }

    // Etiqueta dd/mm debajo de cada barra
    var partes = fechas[i].split('-');
    var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', x + barW / 2);
    txt.setAttribute('y', H + LBL - 2);
    txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('font-size', '8');
    txt.setAttribute('fill', '#888');
    txt.setAttribute('font-family', 'Segoe UI, sans-serif');
    txt.textContent = partes[2] + '/' + partes[1];
    svg.appendChild(txt);

    // Valor encima de la barra
    if (val > 0) {
      var vtxt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      vtxt.setAttribute('x', x + barW / 2);
      vtxt.setAttribute('y', Math.max(y - 2, 8));
      vtxt.setAttribute('text-anchor', 'middle');
      vtxt.setAttribute('font-size', '7');
      vtxt.setAttribute('fill', '#ccc');
      vtxt.setAttribute('font-family', 'Segoe UI, sans-serif');
      vtxt.textContent = val >= 1000 ? (val/1000).toFixed(1)+'k' : val;
      svg.appendChild(vtxt);
    }
  }

  // Línea base
  var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', 0); line.setAttribute('y1', H);
  line.setAttribute('x2', W); line.setAttribute('y2', H);
  line.setAttribute('stroke', '#444'); line.setAttribute('stroke-width', '1');
  svg.appendChild(line);

  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (H + LBL + 2));
  svg.setAttribute('height', H + LBL + 2);
}

// ── filtrar y dibujar ──────────────────────────────────────
function applyFilters() {
  var linea    = document.getElementById('selLinea').value;
  var desde    = document.getElementById('fechaDesde').value;
  var hasta    = document.getElementById('fechaHasta').value;
  var sentido  = document.getElementById('selSentido').value;
  var horaDesde = document.getElementById('horaDesde').value;
  var horaHasta = document.getElementById('horaHasta').value;
  var hD = horaDesde !== '' ? parseInt(horaDesde) : -1;
  var hH = horaHasta !== '' ? parseInt(horaHasta) : 25;

  var zonaMap = {};
  var usosPorHora = {};
  var usosPorDia  = {};

  // Calcular rango de últimos 8 días a partir del máximo disponible en los datos
  var todasFechas = RAW_DATA.map(function(d){ return d.f; }).filter(Boolean).sort();
  var fechaMax = todasFechas.length ? todasFechas[todasFechas.length-1] : '';
  var fecha8 = '';
  if (fechaMax) {
    var dm = new Date(fechaMax + 'T00:00:00');
    dm.setDate(dm.getDate() - 7);
    fecha8 = dm.toISOString().slice(0,10);
  }

  for (var i = 0; i < RAW_DATA.length; i++) {
    var d = RAW_DATA[i];
    if (linea   && d.l !== linea)   continue;
    if (sentido && d.s !== sentido) continue;
    if (desde   && d.f < desde)     continue;
    if (hasta   && d.f > hasta)     continue;
    var h = (d.h !== undefined && d.h >= 0) ? d.h : -1;
    if (hD >= 0 && h < hD)  continue;
    if (hH < 24 && h > hH)  continue;

    // acumular por zona
    var k = d.lat+'|'+d.lon+'|'+d.l+'|'+d.s;
    if (!zonaMap[k]) zonaMap[k] = { lat:d.lat, lon:d.lon, linea:d.l, sentido:d.s, usos:0, fechas:[] };
    zonaMap[k].usos += d.u;
    zonaMap[k].fechas.push(d.f);

    // acumular por hora
    if (h >= 0) usosPorHora[h] = (usosPorHora[h] || 0) + d.u;

    // acumular por día (solo últimos 8 días del dataset)
    if (d.f && d.f >= fecha8) usosPorDia[d.f] = (usosPorDia[d.f] || 0) + d.u;
  }

  var zonas = Object.values(zonaMap);
  var totalUsos = zonas.reduce(function(a,z){ return a+z.usos; }, 0);

  document.getElementById('lblZonas').textContent  = zonas.length.toLocaleString();
  document.getElementById('lblUsos').textContent   = totalUsos.toLocaleString();
  document.getElementById('lblLinea').textContent  = linea || 'todas';
  document.getElementById('lblSentido').textContent = sentido || 'ambos';
  var horaLabel = (horaDesde !== '' || horaHasta !== '')
    ? (horaDesde !== '' ? horaDesde+'h' : '0h') + ' – ' + (horaHasta !== '' ? horaHasta+'h' : '23h')
    : 'todas';
  document.getElementById('lblHora').textContent = horaLabel;

  if (clusterGroup) map.removeLayer(clusterGroup);
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 60,
    iconCreateFunction: function(cluster) {
      var total = cluster.getAllChildMarkers().reduce(function(a,m){ return a+(m._usos||0); },0);
      return mkIcon(total);
    },
    disableClusteringAtZoom: 16,
    showCoverageOnHover: false,
    animate: true
  });

  for (var j = 0; j < zonas.length; j++) {
    var z = zonas[j];
    var fechasStr = z.fechas.sort().slice(0,3).join(', ') + (z.fechas.length > 3 ? ' (+' + (z.fechas.length-3) + ' más)' : '');
    var m = L.marker([z.lat, z.lon], { icon: mkIcon(z.usos) });
    m._usos = z.usos;
    m.bindPopup('<b>'+z.linea+'</b><br>📍 '+z.lat+', '+z.lon+'<br>🚌 Usos: <b>'+z.usos.toLocaleString()+'</b><br>↔ '+z.sentido+'<br>📅 '+fechasStr);
    clusterGroup.addLayer(m);
  }
  map.addLayer(clusterGroup);
  if (zonas.length > 0 && linea) {
    try { map.fitBounds(clusterGroup.getBounds(), { padding: [40,40] }); } catch(e) {}
  }

  renderChartHoras(usosPorHora);
  renderChartDias(usosPorDia);
}

// ── cargar datos JSON externo ──────────────────────────────
function setProgress(pct, txt) {
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('prog-text').textContent = txt;
}

function fetchJSON(url, onProgress) {
  return new Promise(function(resolve, reject) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    if (onProgress) xhr.onprogress = onProgress;
    xhr.onload = function() {
      if (xhr.status === 200) {
        try { resolve(JSON.parse(xhr.responseText)); }
        catch(e) { reject('Error JSON: ' + e.message); }
      } else { reject('HTTP ' + xhr.status); }
    };
    xhr.onerror = function() { reject('Error de red'); };
    xhr.send();
  });
}

function finalizarCarga(data) {
  RAW_DATA = data;
  setProgress(95, 'Procesando...');
  initFilters();
  applyFilters();
  setProgress(100, 'Listo — ' + RAW_DATA.length.toLocaleString() + ' registros');
  setTimeout(function(){ document.getElementById('loading').style.display='none'; }, 400);
}

function loadData() {
  setProgress(5, 'Verificando archivos...');
  fetchJSON('datos_indice.json')
    .then(function(indice) {
      var partes = indice.partes || [];
      if (!partes.length) throw new Error('vacío');
      var total = partes.length;
      var secuencia = Promise.resolve([]);
      partes.forEach(function(nombre, i) {
        secuencia = secuencia.then(function(acum) {
          return fetchJSON(nombre, function(e) {
            if (e.lengthComputable)
              setProgress(10 + Math.round((i + e.loaded/e.total) / total * 82),
                'Descargando parte ' + (i+1) + '/' + total + ' (' + Math.round(e.loaded/1024) + ' KB)');
          }).then(function(parte) { return acum.concat(parte); });
        });
      });
      return secuencia;
    })
    .then(function(data) { finalizarCarga(data); })
    .catch(function() {
      setProgress(10, 'Conectando con el servidor...');
      fetchJSON('datos.json', function(e) {
        if (e.lengthComputable)
          setProgress(10 + Math.round(e.loaded/e.total*82),
            'Descargando datos: ' + Math.round(e.loaded/1024) + ' KB');
      })
      .then(function(data) { finalizarCarga(data); })
      .catch(function(err) {
        document.getElementById('prog-text').textContent = 'Error al cargar datos: ' + err;
      });
    });
}

function initFilters() {
  var lines = [...new Set(RAW_DATA.map(function(d){ return d.l; }))].sort();
  var dates = [...new Set(RAW_DATA.map(function(d){ return d.f; }))].sort();
  var horas = [...new Set(RAW_DATA.map(function(d){ return d.h; }).filter(function(h){ return h >= 0; }))].sort(function(a,b){return a-b;});

  var sel = document.getElementById('selLinea');
  lines.forEach(function(l){ var o=document.createElement('option'); o.value=l; o.textContent=l; sel.appendChild(o); });

  if (dates.length > 0) {
    document.getElementById('fechaDesde').value = dates[0];
    document.getElementById('fechaHasta').value  = dates[dates.length-1];
  }

  // Poblar selectores de hora
  var selHD = document.getElementById('horaDesde');
  var selHH = document.getElementById('horaHasta');
  horas.forEach(function(h) {
    var lbl = h + ':00';
    var o1 = document.createElement('option'); o1.value = h; o1.textContent = lbl; selHD.appendChild(o1);
    var o2 = document.createElement('option'); o2.value = h; o2.textContent = lbl; selHH.appendChild(o2);
  });

  document.getElementById('btnFiltrar').addEventListener('click', applyFilters);
}
